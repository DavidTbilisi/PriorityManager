directories:
  tasks_dir: "tasks"
  archive_dir: "archive"
  test_tasks_dir: "tests/test_tasks"
  test_archive_dir: "tests/test_archive"

statuses:
  - "To Do"
  - "In Progress"
  - "Blocked"
  - "Complete"
  - "Archived"

export_files:
  csv: "tasks_export.csv"
  json: "tasks_export.json"
  yaml: "tasks_export.yaml"

defaults:
  priority: 0
  description: "No description"
  due_date: "No due date"
  tags: ""
  status: "To Do"


table:
  columns:
    - name: "Task Name"
      max_length: 30

    - name: "Priority Score"
      max_length: 52

    - name: "Status"
      max_length: 15

    # - name: "Description"
    #   max_length: 30

    - name: "Tags"
      max_length: 30


ms_todo:
  token: ""  # Set via MS_TODO_TOKEN env var or run: priority-manager auth
  # Optional MSAL app registration settings for device flow (leave blank to use defaults)
  client_id: ""  # e.g. your Azure AD app's Application (client) ID
  tenant: "common"  # or your tenant ID / domain


gantt:
  height: 800
